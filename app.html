  ${list.map((p) => `<tr class="click" data-act="editProduct" data-id="${p.id}"><td><b>${esc(p.ref)}</b></td><td>${esc(p.name)}<div class="tiny muted">${esc(p.brand || '')}</div></td>
   <td><span class="tag">${CATEGORIES[p.category]}</span></td><td class="small muted">${productSpecs(p)}</td><td class="num"><b>${fmt(p.stock)}</b>${m2sub(p, p.stock)}</td>
   <td class="num"><button class="sm ghost" data-act="dupProduct" data-id="${p.id}" title="Dupliquer">⧉</button></td></tr>`).join('')}</table>`
    : `<div class="empty"><div class="e">📦</div>Aucune référence ici. Ajoutez votre première dalle !</div>`}</div>`;
}
function productForm(p) {
  const f = (k, label, type = 'text', cls = '') => `<label class="f ${cls}">${label}<input data-pf="${k}" type="${type}" value="${esc(p[k] == null ? '' : p[k])}" ${type === 'number' ? 'step="any"' : ''}></label>`;
  let h = `<h2>${p._new ? 'Nouvelle référence' : 'Modifier la référence'}</h2><div class="form">
    <label class="f">Catégorie<select data-pf="category">${Object.entries(CATEGORIES).map(([k, v]) => `<option value="${k}" ${p.category === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    ${f('ref', 'Référence *')}${f('name', 'Désignation *', 'text', 'span2')}${f('brand', 'Marque')}${f('stock', 'Quantité en stock', 'number')}
    ${p.category !== 'dalle' ? f('weightKg', 'Poids unitaire (kg)', 'number') : ''}${f('volumeM3', 'Volume unitaire transport (m³)', 'number')}`;
  if (p.category === 'dalle') {
    h += `${f('pitch', 'Pitch (mm)', 'number')}${f('widthMm', 'Largeur (mm)', 'number')}${f('heightMm', 'Hauteur (mm)', 'number')}${f('depthMm', 'Profondeur (mm)', 'number')}
    ${f('pxW', 'Résolution largeur (px)', 'number')}${f('pxH', 'Résolution hauteur (px)', 'number')}${f('weightKg', 'Poids (kg)', 'number')}
    ${f('powerMax', 'Conso max (W)', 'number')}${f('powerAvg', 'Conso moyenne (W)', 'number')}${f('maxChain', 'Max dalles / ligne élec (fabricant)', 'number')}
    <div class="span4 small" id="m2info">${m2Info(p)}</div>`;
  } else if (p.category === 'processeur') {
    h += `${f('ports', 'Nombre de ports', 'number')}${f('pxPerPort', 'Pixels max / port', 'number')}`;
  }
  h += prodFilesHTML(p) + `<label class="f span4">Notes<textarea data-pf="notes">${esc(p.notes || '')}</textarea></label></div>
  <div class="modal-actions">${p._new ? '' : `<button class="danger" data-act="deleteProduct" style="margin-right:auto">Supprimer</button>`}<button data-act="closeModal">Annuler</button><button class="primary" data-act="saveProduct">Enregistrer</button></div>`;
  return h;
}
function m2Info(p) {
  const a = (num(p.widthMm) * num(p.heightMm)) / 1e6;
  return a ? `🟦 Surface : <b>${fmt(a, 3)} m²</b> par dalle · stock <b>${fmt(a * num(p.stock), 2)} m²</b> · ${fmt(1 / a, 2)} dalles au m²` : '';

/* ---------------- STOCK ---------------- */
function vStock() {
  const rows = db().products.map((p) => { const u = peakUsage(p.id, ui.stockFrom, ui.stockTo); return { p, used: u.peak, free: num(p.stock) - u.peak, projects: u.projects }; })

  return `<div class="page-head"><div><h1>Stock & disponibilités</h1><div class="sub">Pic d'utilisation sur la période (projets qui se chevauchent cumulés) · quantités et surfaces en m²</div></div>

    <td class="num"><b style="color:${r.free < 0 ? 'var(--bad)' : r.free === 0 ? 'var(--warn)' : 'var(--ok)'}">${fmt(r.free)}</b>${m2sub(r.p, r.free)}</td>
    <td><div class="bar"><i class="${r.free < 0 ? 'bad' : pct > 85 ? 'warn' : ''}" style="width:${pct}%"></i></div></td>
    <td class="small">${r.projects.map((x) => `<span class="tag" style="border-color:${x.p.color}">${esc(x.p.name)} ×${x.q}</span>`).join(' ') || '<span class="dim">—</span>'}</td></tr>`; }).join('')}
  </table></div>`;
}

/* ---------------- PLANNING ---------------- */
function vPlanning() {
  const days = 42; const start = ui.planStart; const end = addDays(start, days - 1); const t = todayISO();
  const projs = db().projects.filter((p) => p.status !== 'annule' && p.start && overlaps(start, end, p.start, p.end)).sort((a, b) => a.start.localeCompare(b.start));
  const dayIdx = (iso) => Math.round((new Date(iso + 'T00:00:00') - new Date(start + 'T00:00:00')) / 864e5);
  const head = Array.from({ length: days }, (_, i) => { const d = addDays(start, i); const dt = new Date(d + 'T00:00:00'); const we = dt.getDay() === 0 || dt.getDay() === 6;
    return `<div class="g-day ${we ? 'we' : ''} ${d === t ? 'today' : ''}">${dt.getDate() === 1 || i === 0 ? dt.toLocaleDateString('fr-FR', { month: 'short' }) + '<br>' : ''}${dt.getDate()}</div>`; }).join('');
  const ti = dayIdx(t);
  return `<div class="page-head"><div><h1>Planning</h1><div class="sub">Sorties et retours de matériel — ${fmtDate(start)} → ${fmtDate(end)}</div></div>
    <div class="row"><button data-act="planShift" data-v="-14">◀ 2 sem.</button><button data-act="planToday">Aujourd'hui</button><button data-act="planShift" data-v="14">2 sem. ▶</button><button class="primary" data-act="newProject">✦ Nouveau projet</button></div></div>
  <div class="card flat gantt"><div style="min-width:1100px">
    <div class="g-head"><div class="g-label" style="background:var(--panel2)"><b>Projet</b></div><div style="display:flex;flex:1">${head}</div></div>
    ${projs.length ? projs.map((p) => { const a = Math.max(0, dayIdx(p.start)), b = Math.min(days - 1, dayIdx(p.end || p.start)); const sh = projectShortages(p).length;
      return `<div class="g-row"><div class="g-label"><b>${esc(p.name)}</b><span class="tiny muted">${esc(p.venue || p.client || '')}</span></div>
      <div class="g-track">${ti >= 0 && ti < days ? `<div class="g-today" style="left:${(ti + .5) / days * 100}%"></div>` : ''}
      <div class="g-bar ${p.status === 'devis' ? 'devis' : ''}" data-act="openProject" data-id="${p.id}" style="left:${a / days * 100}%;width:${(b - a + 1) / days * 100}%;background:${p.color}">${sh ? '⚠ ' : ''}${esc(p.name)} · ${p.screens.reduce((s, x) => s + panelCount(x), 0)} dalles · ${fmt(p.screens.reduce((a, x) => a + screenM2(x), 0), 1)} m²</div></div></div>`; }).join('')
      : `<div class="empty"><div class="e">🗓️</div>Aucun projet sur cette période.</div>`}
  </div></div><p class="tiny muted">Barres en pointillés : devis / options. ⚠ : il manque du matériel sur la période.</p>`;
}

   <button class="primary" data-act="newProject">✦ Nouveau projet</button></div></div>
  ${list.length ? `<div class="grid g3">${list.map((p) => { const sh = projectShortages(p); const n = p.screens.reduce((s, x) => s + panelCount(x), 0);

    if (ui.tab === 'elec' || ui.tab === 'data') setupPaint(s, ui.tab);

function setup3D(s) {
  const c = document.getElementById('view3d'); if (!c) return;
  const redraw = () => draw3D(c, s, ui.v3d); redraw();
  let drag = null;
  c.onmousedown = (e) => { drag = { x: e.clientX, y: e.clientY, yaw: ui.v3d.yaw, pitch: ui.v3d.pitch }; };
  window.onmousemove = (e) => { if (!drag) return; ui.v3d.yaw = drag.yaw + (e.clientX - drag.x) / 160; ui.v3d.pitch = Math.max(-1.4, Math.min(1.4, drag.pitch + (e.clientY - drag.y) / 160)); redraw(); };
  window.onmouseup = () => { drag = null; };
  c.onwheel = (e) => { e.preventDefault(); ui.v3d.zoom = Math.max(0.3, Math.min(4, ui.v3d.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); redraw(); };
  c.ondblclick = () => { ui.v3d = { yaw: 0, pitch: 0, zoom: 1 }; redraw(); };
}

}
function setupPaint(s, kind) {
  const area = document.getElementById('planArea'); if (!area) return;
  const refreshPlan = () => { area.innerHTML = planSVG(s, kind, { rear: ui.rear, sel: ui.sel[kind] }); };
  const apply = (idx) => {
    materialize(s, kind); const cfg = s[kind]; const sel = ui.sel[kind]; const old = cfg.assign[idx];
    if (ui.tool === 'start') { if (old < 0) return false; ui.sel[kind] = old; setLineStart(s, kind, old, idx); return true; }
    if (ui.tool === 'paint') {
      if (old === sel) return false;
      cfg.assign[idx] = sel; if (cfg.orders[old]) cfg.orders[old] = cfg.orders[old].filter((i) => i !== idx);
    } else {
      cfg.orders[sel] = cfg.orders[sel] || [];
      if (cfg.orders[sel].includes(idx)) return false;
      if (old !== sel && cfg.orders[old]) cfg.orders[old] = cfg.orders[old].filter((i) => i !== idx);
      cfg.assign[idx] = sel; cfg.orders[sel].push(idx);
    }
    return true;
  };
  const idxOf = (e) => { const t = e.target.closest('[data-idx]'); return t ? +t.dataset.idx : null; };
  area.onmousedown = (e) => { const i = idxOf(e); if (i == null) return; e.preventDefault(); ui.painting = true; if (apply(i)) refreshPlan(); };
  area.onmouseover = (e) => { if (!ui.painting || ui.tool !== 'paint') return; const i = idxOf(e); if (i != null && apply(i)) refreshPlan(); };
  window.onmouseup = () => { if (ui.painting) { ui.painting = false; Store.save(); render(); } };
}

/* ---------- Tactile : traduit le doigt en souris pour les vues qui se manipulent ---------- */
(function touchBridge() {
  let T = null;
  const fake = (t, target, extra) => Object.assign({ clientX: t.clientX, clientY: t.clientY, target, button: 0, buttons: 1, shiftKey: false, ctrlKey: false, _p: false, preventDefault() { this._p = true; }, stopPropagation() {} }, extra || {});
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2 && T && T.el && T.el.onwheel) { T.pinch = dist(e.touches[0], e.touches[1]); e.preventDefault(); return; }
    if (e.touches.length !== 1) return;
    let el = e.target; while (el && el !== document.body && !el.onmousedown) el = el.parentElement;
    if (!el || el === document.body) { T = null; return; }
    const ev = fake(e.touches[0], e.target); el.onmousedown(ev);
    T = { el, canvas: el.tagName === 'CANVAS', active: ev._p || el.tagName === 'CANVAS' };
    if (T.active) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', (e) => {
    if (!T) return;
    if (e.touches.length === 2 && T.pinch && T.el.onwheel) {
      const d = dist(e.touches[0], e.touches[1]); const r = d / T.pinch;
      if (r > 1.08 || r < 0.92) { T.el.onwheel(fake(e.touches[0], e.target, { deltaY: r > 1 ? -1 : 1 })); T.pinch = d; }
      e.preventDefault(); return;
    }
    if (!T.active) return;
    const t = e.touches[0]; const target = document.elementFromPoint(t.clientX, t.clientY) || e.target; const ev = fake(t, target);
    if (window.onmousemove) window.onmousemove(ev);
    if (T.el.onmouseover) T.el.onmouseover(ev);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (!T) return; if (e.touches.length) return;
    if (T.active && window.onmouseup) window.onmouseup(fake(e.changedTouches[0], e.target));
    T = null;
  });
})();

function showWebJoin(err) {
  let el = document.getElementById('login'); if (!el) { el = document.createElement('div'); el.id = 'login'; document.body.appendChild(el); }
  el.innerHTML = webJoinHTML(err); el.classList.remove('hidden');
  const sp = document.getElementById('splash'); if (sp) sp.classList.add('out');
}
async function webJoin(code) {
  const o = parseCode(String(code || '').trim()); if (!o) return showWebJoin('Code invalide : il commence par ILM1-');
  const el = document.getElementById('login'); if (el) el.innerHTML = '<div class="empty" style="padding-top:140px">☁ Connexion aux données partagées…</div>';
  const st = Store.db.settings; st.replyUrl = o.u; st.replyKey = o.k;
  try {
    const res = await firstContact(); if (!res.rev || !res.data) throw new Error('Aucune donnée partagée : activez d\'abord le partage sur le PC (Comptes & partage).');
    await useRemote(res); localInfo().userId = null; await Store.saveNow();
    location.replace(location.pathname + location.search);
  } catch (e) { showWebJoin(typeof syncErr === 'function' ? syncErr(e) : e.message); }
}
/* Appelée au démarrage : false = on reste sur l'écran de connexion */
async function webBoot() {
  if (!IS_WEB) return true;
  document.body.classList.add('is-web');
  const dp = document.getElementById('dataPath'); if (dp) dp.textContent = 'Téléphone — données partagées';
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* */ } }
  const m = location.hash.match(/c=(ILM1-[A-Za-z0-9+/=%]+)/);
  if (m) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* */ } await webJoin(decodeURIComponent(m[1])); return false; }
  if (!syncOn()) { showWebJoin(); return false; }
  return true;
}
