function emptyDB() {

    products: [], projects: [], techs: [], vehicles: [] };

/* ---------- Migrations : chaque évolution de l'appli ajoute une étape ici ---------- */
const MIGRATIONS = {
  // v1 -> v2 : ajout pixel map, paramètres data & réglage "vue arrière"
  1: (db) => {
    db.projects.forEach((p) => (p.screens || []).forEach((s) => {
      s.pixmap = Object.assign(defaultPixmap(db.settings), s.pixmap || {});
      s.data = Object.assign(defaultData(db.settings), s.data || {});
    }));
    return db;
  },
  // v2 -> v3 : techniciens, véhicules, équipe & transport par projet (ajoutés par la normalisation)
  2: (db) => db
};
function migrate(db) {
  if (!db || typeof db !== 'object') return emptyDB();
  db.schemaVersion = db.schemaVersion || 1;
  while (db.schemaVersion < SCHEMA_VERSION) {
    const step = MIGRATIONS[db.schemaVersion];
    if (step) db = step(db);
    db.schemaVersion++;

  const hadV2 = db.settings && db.settings.waModeV2;

  }

    db.settings.calTechV1 = true; db.settings.calGroup = 'tech';

    }));

/* =====================================================================
   ENGINE — calculs : chemins de câblage, répartition, géométrie, stock
   ===================================================================== */
const getProduct = (id) => Store.db.products.find((p) => p.id === id) || (id && String(id).startsWith('cust') && typeof findCustomProduct === 'function' ? findCustomProduct(id) : undefined);

/* ---------- Chemin global (ordre de parcours des dalles) ----------
   orient 'h' : on parcourt rangée par rangée ; 'v' : colonne par colonne
   pattern 'snake' : aller-retour (serpentin) ; 'raster' : toujours dans le même sens (retour au début)
   start : coin de départ TL / TR / BL / BR (vue de face) */

  const top = start[0] === 'T', left = start[1] === 'L';
  const out = [];

      const r = top ? k : rows - 1 - k;
      let ltr = left; if (pattern === 'snake' && k % 2 === 1) ltr = !ltr;
      for (let j = 0; j < cols; j++) { const c = ltr ? j : cols - 1 - j; out.push(r * cols + c); }
    }
  } else {
    for (let k = 0; k < cols; k++) {
      const c = left ? k : cols - 1 - k;
      let ttb = top; if (pattern === 'snake' && k % 2 === 1) ttb = !ttb;
      for (let j = 0; j < rows; j++) { const r = ttb ? j : rows - 1 - j; out.push(r * cols + c); }

/* ---------- Capacités ---------- */
function elecCapacity(screen) {
  const p = getProduct(screen.productId) || {};
  const e = screen.elec;
  const watt = num(e.basis === 'avg' ? p.powerAvg : p.powerMax) || num(p.powerMax) || 1;
  const usable = num(e.voltage) * num(e.amps) * num(e.safety) / 100;
  let cap = Math.floor(usable / watt);
  const limits = [];
  if (num(p.maxChain) > 0) limits.push(num(p.maxChain));
  if (num(e.maxPerLine) > 0) limits.push(num(e.maxPerLine));
  limits.forEach((l) => { cap = Math.min(cap, l); });
  return { cap: Math.max(1, cap), watt, usable, byPower: Math.floor(usable / watt) };
}
function dataCapacity(screen) {
  const p = getProduct(screen.productId) || {};
  const d = screen.data;
  const proc = getProduct(d.processorId);
  const pxPort = num(proc && proc.pxPerPort) || num(d.pxPerPort) || 655360;
  const px = (num(p.pxW) || 1) * (num(p.pxH) || 1);
  let cap = Math.floor(pxPort / px);
  if (num(d.maxPerPort) > 0) cap = Math.min(cap, num(d.maxPerPort));
  return { cap: Math.max(1, cap), pxPort, px };

    }
  }
  return assign;

/* Résout un plan (élec ou data) : assignation + ordre de câblage de chaque ligne */

function resolvePlan(screen, kind) {

  return { peak, projects: usages };

  return runs.map(([x, y]) => (x === y ? f(x) : `${f(x)}→${f(y)}`)).join(', ');
}

/* ---------- Messages ---------- */
function normPhone(raw) {
  let s = String(raw || '').trim(); const plus = s.startsWith('+'); s = s.replace(/\D/g, '');
  if (!s) return ''; if (plus) return s; if (s.startsWith('00')) return s.slice(2);
  if (s.startsWith('0')) return String(Store.db.settings.countryCode || '33').replace(/\D/g, '') + s.slice(1);
  return s;
}
function fillTemplate(tpl, vars) {
  const out = [];
  String(tpl || '').split('\n').forEach((line) => {
    let had = false, empty = true;
    const res = line.replace(/\{(\w+)\}/g, (m, k) => { if (!(k in vars)) return m; had = true; const v = vars[k] == null ? '' : String(vars[k]); if (v.trim()) empty = false; return v; });
    if (!(had && empty)) out.push(res);
  });
  return out.join('\n').replace(/\n{3,}/g, '\n\n');
}
function reqVars(r, p) {
  const t = getTech(r.techId) || {}; const st = Store.db.settings;
  return { prenom: t.firstName, nom: t.lastName, societe: st.company, projet: p.name, client: p.client, lieu: p.venue, dates: fmtDays(r.dates), horaires: hoursMsg(r), role: r.role, nbjours: r.dates.length, lien: reqLink(r), changements: changesMsg(r, p) };
}
function fleetVars(f, p) {

  return { prenom: t.firstName, nom: t.lastName, societe: Store.db.settings.company, projet: p.name, client: p.client, lieu: p.venue, dates: fmtDays(rangeDays(f.start, f.end)), vehicule: v.name, immat: v.plate, role: 'Chauffeur' };
}
// Message proposé selon l'étape : option/booking → relance → confirmation officielle
const autoKind = (r) => (r.status === 'valide' ? 'update' : r.status === 'option' ? 'confirm' : r.status === 'attente' && r.sentAt ? 'relance' : r.kind === 'option' ? 'option' : 'demande');
// Ce que la page de réponse du technicien doit proposer pour ce message
const pageKind = (r, kind) => ({ confirm: 'confirm', update: 'confirm', option: 'option', demande: 'booking', relance: r.kind === 'option' ? 'option' : 'booking' }[kind] || null);
const tplFor = (kind) => { const st = Store.db.settings; return { option: st.msgOption, demande: st.msgDemande, relance: st.msgRelance, confirm: st.msgConfirm, update: st.msgUpdate, release: st.msgRelease, transport: st.msgTransport, grp: st.msgGroup, fdr: st.msgRoadmap }[kind]; };
// Mode « collage » (par défaut) : le message va dans le presse-papiers et WhatsApp s'ouvre sur la conversation
// → Ctrl+V puis Entrée. WhatsApp Desktop supprime souvent les emojis d'un texte pré-rempli par lien.
const waPaste = () => Store.db.settings.waPaste !== false;
function waLink(phone, text) {
  const n = normPhone(phone); const t = text && !waPaste() ? encodeURIComponent(text) : '';
  const mode = Store.db.settings.waMode;
  if (mode === 'app') return `whatsapp://send?phone=${n}${t ? '&text=' + t : ''}`;
  if (mode === 'web') return `https://web.whatsapp.com/send?phone=${n}${t ? '&text=' + t : ''}`;
  // auto : l'application de bureau convertit ce lien vers WhatsApp Desktop s'il est installé, sinon page web
  return `https://wa.me/${n}${t ? '?text=' + t : ''}`;
}
const smsLink = (phone, text) => `sms:+${normPhone(phone)}?body=${encodeURIComponent(text)}`;
const mailLink = (email, subject, text) => `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
async function openExternal(url) {
  try {
    if (window.desktop && window.desktop.openExternal) return await window.desktop.openExternal(url);
  } catch (e) { /* repli ci-dessous */ }
  if (/^https?:/.test(url)) { window.open(url, '_blank', 'noopener'); return; }
  const a = document.createElement('a'); a.href = url; a.click();
}
async function copyText(t, quiet) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if (!quiet) toast('Message copié 📋');
}

/* ---------- Conflits & charges ---------- */
function techBusy(techId, dates, excludeReqId) {
  const out = [];
  activeProjects().forEach((p) => p.crew.forEach((r) => {
    if (r.techId !== techId || r.id === excludeReqId || r.status === 'attente' || r.released) return;
    const common = r.dates.filter((d) => dates.includes(d)); if (common.length) out.push({ p, r, common });
  }));
  return out.sort((a, b) => ST_RANK[b.r.status] - ST_RANK[a.r.status]);
}
const busyTxt = (b) => `${CREW_ST[b.r.status].ic} ${CREW_ST[b.r.status].l} sur ${esc(b.p.name)} (${fmtDaysShort(b.common)})`;
function vehicleBusy(vehicleId, start, end, excludeId) {
  const out = [];
  activeProjects().forEach((p) => p.fleet.forEach((f) => {
    if (f.vehicleId !== vehicleId || f.id === excludeId) return;
    if (overlaps(start, end, f.start, f.end)) out.push({ p, f });
  }));
  return out;
}
function vehAlerts(v, until) {
  const out = []; const t = todayISO();
  [['ctDate', 'Contrôle technique'], ['serviceDate', 'Entretien']].forEach(([k, l]) => {
    const d = v[k]; if (!d) return;
    if (d < t) out.push({ cls: 'bad', txt: `${l} dépassé (${fmtDate(d)})` });
    else if (until && d <= until) out.push({ cls: 'bad', txt: `${l} échoit avant la fin de mission (${fmtDate(d)})` });
    else if (d <= addDays(t, 30)) out.push({ cls: 'warn', txt: `${l} le ${fmtDate(d)}` });
  });
  return out;
}
function projectLoad(p) {
  let kg = 0, m3 = 0, missingW = 0, missingV = 0;
  projectUsage(p).forEach((u, pid) => {
    const x = getProduct(pid); if (!x) return;
    if (num(x.weightKg)) kg += u.qty * num(x.weightKg); else missingW++;
    if (num(x.volumeM3)) m3 += u.qty * num(x.volumeM3); else missingV++;
  });
  let capKg = 0, capM3 = 0;
  p.fleet.forEach((f) => { const v = getVehicle(f.vehicleId); if (v) { capKg += num(v.payloadKg); capM3 += num(v.volumeM3); } });
  return { kg, m3, capKg, capM3, missingW, missingV };
}

function queueMark(via) {

  if (it.fdr) { const rm = ensureRoadmap(it.p); rm.sentTo = rm.sentTo || {}; rm.sentTo[it.t.id] = now; Store.save(); return; }
  if (it.grp) { const rm = ensureRoadmap(it.p); rm.groupInvited = rm.groupInvited || {}; rm.groupInvited[it.t.id] = now; Store.save(); return; }
  const tgt = it.r || it.f;

      if (r.status !== 'valide') { r.status = 'valide'; r.history.push({ at: now, action: 'statut', status: 'valide' }); }
      r.confirmSentAt = now; r.ack = null; r.released = false;
    } else if (it.kind === 'update') {
      r.updateSentAt = now; r.confirmSentAt = now; r.ack = null; r.released = false;
    } else if (it.kind === 'release') {
      r.status = 'indispo'; r.released = true; r.history.push({ at: now, action: 'statut', status: 'indispo', note: 'option levée' });
    } else if (it.kind === 'option' || it.kind === 'demande') {
      r.kind = it.kind === 'option' ? 'option' : 'booking';
      if (r.status === 'indispo') { r.status = 'attente'; r.released = false; }
    }

}

      <td class="num">${v.payloadKg ? fmt(v.payloadKg) + ' kg' : '—'}</td><td class="num">${v.volumeM3 ? fmt(v.volumeM3, 1) + ' m³' : '—'}</td><td>${esc(v.licence || '—')}</td>${dcell('ctDate')}${dcell('serviceDate')}

      : `<div class="empty"><div class="e">🚚</div>Aucun véhicule. Ajoutez votre flotte (ou vos locations récurrentes).</div>`}</div>`;
  } else {
    const list = Store.db.vehicles.filter((v) => v.active !== false);
    body = `<div class="row" style="justify-content:flex-end;margin-bottom:12px">${gridNav('vehShift')}</div>

      const hits = []; activeProjects().forEach((p) => p.fleet.forEach((f) => { if (f.vehicleId === v.id && f.start && d >= f.start && d <= (f.end || f.start)) hits.push({ p, f }); }));
      if (!hits.length) return ''; const h = hits[0];
      return `<div class="av-chip" style="background:${hits.length > 1 ? 'var(--bad)' : h.p.color}" data-act="openProject" data-id="${h.p.id}" title="${dayLabel(d)} — ${hits.map((x) => x.p.name + (getTech(x.f.driverId) ? ' (' + techName(getTech(x.f.driverId)) + ')' : '')).join(' / ')}">${hits.length > 1 ? '⚠' : abbr(h.p.name)}</div>`;
    } })) }, 'Aucun véhicule actif.')}<p class="tiny muted">⚠ rouge : véhicule réservé sur plusieurs projets le même jour.</p>`;

  return `<div class="page-head"><div><h1>Véhicules</h1><div class="sub">Flotte et affectations transport</div></div><button class="primary" data-act="newVehicle">＋ Véhicule</button></div>

}

async function showWaDetect() {
  const el = document.getElementById('waDetect'); if (!el) return;
  if (!(window.desktop && window.desktop.hasWhatsApp)) { el.textContent = ''; return; }
  try { const ok = await window.desktop.hasWhatsApp(); el.innerHTML = ok ? '<span style="color:var(--ok)">✔ WhatsApp Desktop détecté sur ce PC</span>' : '<span style="color:var(--warn)">WhatsApp Desktop non détecté — ouverture par le navigateur</span>'; } catch (e) { /* ignore */ }
}

/* ---------- Accueil : à faire ---------- */
function todoHTML() {
  const t0 = todayISO(); const items = [];
  activeProjects().filter((p) => (p.end || p.start || '') >= t0).forEach((p) => {
    const unsent = p.crew.filter((r) => r.status === 'attente' && !r.sentAt).length;
    const waiting = p.crew.filter((r) => r.status === 'attente' && r.sentAt).length;
    const opt = p.crew.filter((r) => r.status === 'option').length;
    const parts = [];
    if (unsent) parts.push(`<b>${unsent}</b> demande(s) à envoyer`);
    if (waiting) parts.push(`<b>${waiting}</b> réponse(s) attendue(s)`);
    if (opt) parts.push(`<b>${opt}</b> option(s) à transformer en booking`);
    const noAck = p.crew.filter((r) => r.status === 'valide' && r.confirmSentAt && !r.ack).length;
    const changed = p.crew.filter((r) => ackChanges(r, p).length).length;
    if (changed) parts.push(`<b>${changed}</b> technicien(s) à prévenir d'un changement (mise à jour)`);
    if (noAck) parts.push(`<b>${noAck}</b> réponse(s) de booking / mise à jour attendue(s)`);
    if (parts.length) items.push(`<div class="alert">👷 <b>${esc(p.name)}</b> — ${parts.join(', ')} <a data-act="openProject" data-id="${p.id}">Voir →</a></div>`);
  });
  Store.db.vehicles.filter((v) => v.active !== false).forEach((v) => vehAlerts(v).forEach((a) => items.push(`<div class="alert ${a.cls === 'bad' ? 'bad' : ''}">🚚 <b>${esc(v.name)}</b> (${esc(v.plate || '')}) — ${a.txt} <a data-nav-go="vehicles">Voir →</a></div>`)));
  return items.length ? `<hr class="sep"><h3>Équipe & véhicules</h3>${items.join('')}` : '';
}

/* ---------- PDF : page équipe & transport ---------- */

  return `<div class="page">${hdr('Équipe & transport')}

    ${crew.map((r) => { const t = getTech(r.techId) || {}; return `<tr><td><b>${esc(techName(t))}</b></td><td>${esc(t.phone || '')}</td><td>${esc(r.role || '')}</td><td>${esc(fmtDays(r.dates))}${hoursShort(r) ? '<br><small>🕐 ' + esc(hoursShort(r)) + '</small>' : ''}</td><td>${CREW_ST[r.status].l}</td></tr>`; }).join('')}</table>` : ''}
    ${p.fleet.length ? `<h2 style="margin-top:16px">Transport</h2><table><tr><th>Véhicule</th><th>Immatriculation</th><th>Départ</th><th>Retour</th><th>Chauffeur</th><th>Téléphone</th><th>Note</th></tr>
    ${p.fleet.map((f) => { const v = getVehicle(f.vehicleId) || {}; const d = getTech(f.driverId) || {}; return `<tr><td><b>${esc(v.name || '')}</b></td><td>${esc(v.plate || '')}</td><td>${fmtDate(f.start)}</td><td>${fmtDate(f.end)}</td><td>${f.driverId ? esc(techName(d)) : '—'}</td><td>${esc(d.phone || '')}</td><td>${esc(f.note || '')}</td></tr>`; }).join('')}</table>
    <div class="muted" style="margin-top:4px">Charge estimée : ${fmt(projectLoad(p).kg)} kg / ${fmt(projectLoad(p).capKg)} kg · ${fmt(projectLoad(p).m3, 1)} m³ / ${fmt(projectLoad(p).capM3, 1)} m³</div>` : ''}</div>`;
}

function readInto(sel, key, obj) { document.querySelectorAll(sel).forEach((el) => { obj[el.dataset[key]] = el.value; }); }
const findReq = (id) => { for (const p of Store.db.projects) { const r = p.crew.find((x) => x.id === id); if (r) return { p, r }; } return {}; };
const findFleet = (id) => { for (const p of Store.db.projects) { const f = p.fleet.find((x) => x.id === id); if (f) return { p, f }; } return {}; };

const teamActions = {
  // --- techniciens ---
  newTech() { ui.edit = { _new: true, id: uid('tec'), firstName: '', lastName: '', phone: '', email: '', licence: 'B', dailyRate: '', skills: [], notes: '', active: true }; openModal(techForm(ui.edit)); },
  editTech(el) { const t = getTech(el.dataset.id); if (!t) return; ui.edit = deepClone(t); openModal(techForm(ui.edit)); },
  addSkill() {

    if (!st.skills.includes(existing)) st.skills.push(existing);
    if (!t.skills.includes(existing)) t.skills.push(existing);
    Store.save(); openModal(techForm(t)); toast(`Poste « ${existing} » ajouté`);
  },
  saveTech() {
    const t = ui.edit; readInto('[data-tf]', 'tf', t);
    t.active = document.querySelector('[data-tfc=active]').checked;
    t.skills = [...document.querySelectorAll('[data-tskill]')].filter((x) => x.checked).map((x) => x.dataset.tskill);

    const isNew = t._new; delete t._new;

  },
  deleteTech() {
    const id = ui.edit.id; const used = Store.db.projects.filter((p) => p.crew.some((r) => r.techId === id) || p.fleet.some((f) => f.driverId === id));
    if (used.length) { if (!confirm(`${techName(ui.edit)} apparaît sur ${used.length} projet(s). Le passer plutôt en « inactif » ?`)) return; const t = getTech(id); t.active = false; Store.save(); closeModal(); render(); return; }

    Store.db.techs = Store.db.techs.filter((t) => t.id !== id); Store.save(); closeModal(); render();
  },
  techChat(el, e) { e.stopPropagation(); const t = getTech(el.dataset.id); openExternal(waLink(t.phone, '')); },

  teamShift(el) { const v = num(el.dataset.v); ui.teamStart = v ? addDays(ui.teamStart, v) : addDays(todayISO(), -3); render(); },
  exportTechsCSV() {
    const cols = ['firstName', 'lastName', 'phone', 'email', 'licence', 'dailyRate', 'city', 'skills', 'notes'];
    const lines = [cols.join(';'), ...Store.db.techs.map((t) => cols.map((k) => csvCell(k === 'skills' ? (t.skills || []).join(', ') : t[k] == null ? '' : t[k])).join(';'))];
    saveFileText('techniciens_impulsion.csv', '﻿' + lines.join('\r\n'), 'csv', 'CSV');
  },
  async importTechsCSV() {
    const txt = await openTextFile('csv'); if (!txt) return;
    const rows = txt.replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim()); const sep = rows[0].includes(';') ? ';' : ',';
    const head = parseCSVLine(rows[0], sep).map((h) => h.trim()); let added = 0, updated = 0;
    rows.slice(1).forEach((l) => {
      const v = parseCSVLine(l, sep); const o = {}; head.forEach((h, i) => { o[h] = (v[i] || '').trim(); });
      if (!o.firstName && !o.lastName) return;
      o.skills = o.skills ? o.skills.split(',').map((s) => s.trim()).filter(Boolean) : []; o.dailyRate = num(o.dailyRate);
      const ex = Store.db.techs.find((t) => normPhone(t.phone) && normPhone(t.phone) === normPhone(o.phone));
      if (ex) { Object.assign(ex, o); updated++; } else { o.id = uid('tec'); o.active = true; Store.db.techs.push(o); added++; }
    });
    Store.save(); render(); toast(`Import : ${added} ajouté(s), ${updated} mis à jour`);
  },
  // --- demandes ---
  solicit() { const p = curProject(); ui.sol = { dates: projectDays(p), role: '', skill: '', techIds: [], hours: Store.db.settings.lastHours ? deepClone(Store.db.settings.lastHours) : emptyHours(), kind: Store.db.settings.lastReqKind === 'booking' ? 'booking' : 'option' }; openModal(solicitHTML()); },

  reqRelease(el) { const { p, r } = findReq(el.dataset.id); if (r) startQueue(p.id, [{ type: 'req', id: r.id, kind: 'release' }]); },
  confirmAllOptions() { const p = curProject(); startQueue(p.id, p.crew.filter((r) => r.status === 'option' && normPhone((getTech(r.techId) || {}).phone)).map((r) => ({ type: 'req', id: r.id, kind: 'confirm' }))); },
  solCreate(el) {
    const s = ui.sol; const p = curProject();
    if (!s.techIds.length) return toast('Sélectionnez au moins un technicien', 'warn');
    if (!s.dates.length) return toast('Choisissez au moins une date', 'warn');
    const now = new Date().toISOString();
    const kind = s.kind === 'option' ? 'option' : 'booking';
    const hrs = cleanHours(s.hours, s.dates); Store.db.settings.lastHours = s.hours ? Object.assign(emptyHours(), { from: s.hours.from, to: s.hours.to, note: '' }) : null;

    p.crew.push(...reqs); Store.save(); ui.sol = null;

    if (r.status === 'valide') toast(`${techName(getTech(r.techId))} validé ✅ — le bouton 💬 envoie maintenant la confirmation`);

/* Champs modifiés (appelé par le gestionnaire global "change") — renvoie true si traité */
function teamChange(t) {
  if (hoursChange(t)) return true;

/* Scène 3D : le plus grand bloc au centre, les autres répartis à gauche / à droite */

/* SHA-256 (fonctionne partout, même hors contexte sécurisé) */
function sha256(str) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str)); const l = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const r = (x, n) => (x >>> n) | (x << (32 - n)); const w = new Array(64);
  for (let o = 0; o < bytes.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3); const s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }

function agoTxt(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return 'à l\'instant'; if (s < 3600) return `il y a ${Math.round(s / 60)} min`; if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  const d = Math.round(s / 86400); return d === 1 ? 'hier' : `il y a ${d} jours`;
}

const accountActions = {
  loginPick(el) { loginState.userId = el.dataset.id; loginState.err = ''; showLogin(); },
  loginGo() {
    const u = getUser(loginState.userId) || (users().length === 1 ? users()[0] : null); if (!u) return;
    const pw = document.getElementById('loginPwd');
    if (!pwdOk(u, pw ? pw.value : '')) { loginState.err = 'Mot de passe incorrect'; showLogin(); return; }
    const L = localInfo(); L.userId = u.id; L.remember = !!(document.getElementById('loginRemember') || {}).checked;
    loginState.err = ''; Store.saveNow(); hideLogin(); userChip(); render(); toast(`Bonjour ${u.name} 👋`);
  },
  logout() { const L = localInfo(); journalFlush(); L.userId = null; Store.saveNow(); userChip(); if (needLogin()) showLogin(); else render(); },
  userNew() { ui.uEdit = { name: '', title: users().length ? 'Direction' : 'Directeur technique', color: USER_COLORS[users().length % USER_COLORS.length] }; openModal(userForm(ui.uEdit)); },
  userEdit(el) { ui.uEdit = deepClone(getUser(el.dataset.id)); openModal(userForm(ui.uEdit)); },
  userColor(el) { ui.uEdit.name = document.getElementById('uName').value; ui.uEdit.title = document.getElementById('uTitle').value; ui.uEdit.color = el.dataset.v; openModal(userForm(ui.uEdit)); },
  userSave() {
    const e = ui.uEdit; const name = document.getElementById('uName').value.trim(); const title = document.getElementById('uTitle').value.trim();
    const p1 = document.getElementById('uPwd').value; const p2 = document.getElementById('uPwd2').value; const noPwd = (document.getElementById('uNoPwd') || {}).checked;
    if (!name) return toast('Indiquez un nom', 'warn');
    if (p1 !== p2) return toast('Les deux mots de passe ne correspondent pas', 'warn');
    if (users().some((u) => u.id !== e.id && u.name.toLowerCase() === name.toLowerCase())) return toast('Ce nom est déjà utilisé', 'warn');
    const first = !users().length;
    if (!e.id) {
      const u = { id: uid('usr'), name, title, color: e.color, pwd: makePwd(p1), createdAt: new Date().toISOString() };
      users().push(u); if (first) { localInfo().userId = u.id; localInfo().remember = true; }
    } else {
      const u = getUser(e.id); Object.assign(u, { name, title, color: e.color }); if (noPwd) u.pwd = null; else if (p1) u.pwd = makePwd(p1);
    }
    Store.save(); closeModal(); userChip(); render();
    toast(first ? 'Compte créé — vous êtes connecté ✔' : 'Compte enregistré ✔');
  },
  userDel(el) {
    const u = getUser(el.dataset.id); if (!u || (curUser() && curUser().id === u.id)) return;
    if (!confirm(`Supprimer le compte « ${u.name} » ? Son historique reste visible.`)) return;
    Store.db.users = users().filter((x) => x.id !== u.id); Store.save(); render();
  }
};

</script>
<script>
/* =====================================================================
   IMPULSION PROD — APPLICATION TÉLÉPHONE
   Mêmes données que les PC (relais Google, partage). Chaque modification est
   appliquée sur la dernière version en ligne puis renvoyée (aucun écrasement).
   ===================================================================== */
(function () {
  'use strict';
  var LS = { get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }, del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* */ } } };
  var A = { cfg: LS.get('ip-app') || {}, raw: null, rev: 0, tab: 'home', stack: [], q: '', busy: false, err: null, last: 0, stockFrom: todayISO(), stockTo: addDays(todayISO(), 3), projFilter: 'avenir', planPast: false };
  var $root = function () { return document.getElementById('root'); };
  var h = esc;

  /* ---------- Relais ---------- */
  function post(o) {
    return fetch(A.cfg.u, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o) })
      .then(function (r) { return r.text(); }).then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Réponse inattendue du script Google'); } if (!j.ok) throw new Error(j.error || 'Erreur du script'); return j; });
  }
  function meName() { var u = me(); return (u ? u.name : 'Téléphone') + ' (mobile)'; }
  function fetchDb(rev) { return post({ action: 'dbget', key: A.cfg.k, rev: rev, dev: '', user: meName(), app: 'mobile' }); }

  /* données affichées : copie migrée (jamais renvoyée) ; les écritures partent de la version en ligne brute */
  function useData(data, rev) {
    A.raw = data; A.rev = rev;
    if ((data.schemaVersion || 0) > SCHEMA_VERSION) A.newer = true;
    try { Store.db = migrate(deepClone(data)); } catch (e) { Store.db = deepClone(data); }
    LS.set('ip-app-cache', { rev: rev, at: Date.now(), data: slim(data) }) || LS.del('ip-app-cache');
  }
  function slim(o) { // retire les gros fichiers (RCG, images) du cache du téléphone
    if (Array.isArray(o)) return o.map(slim);
    if (o && typeof o === 'object') { var r = {}; Object.keys(o).forEach(function (k) { var v = o[k]; if (typeof v === 'string' && v.length > 20000) return; r[k] = slim(v); }); return r; }
    return o;
  }
  function refresh(manual) {
    if (A.busy) return Promise.resolve();
    A.busy = true; drawHeader();
    return fetchDb(A.raw ? A.rev : -1).then(function (j) {
      A.err = null; A.last = Date.now();
      if (j.data) { useData(j.data, j.rev); draw(); if (manual) toast('À jour ✔'); } else if (manual) toast('Déjà à jour ✔');
    }).catch(function (e) { A.err = e.message; if (manual) toast(e.message, true); }).then(function () { A.busy = false; drawHeader(); });
  }
  /* Modification : relit la dernière version en ligne, applique, renvoie (3 essais en cas d'enregistrement simultané) */
  function mutate(fn, logInfo, okMsg) {
    if (A.newer) return Promise.reject(new Error('Les données viennent d\'une version plus récente : mettez à jour app.html sur GitHub.'));
    toast('Enregistrement…');
    var attempt = function (n) {
      return fetchDb(-1).then(function (g) {
        var data = g.data; if (!data) throw new Error('Aucune donnée en ligne');
        var u = me(); var stamp = { by: u ? u.id : '', byName: meName(), at: new Date().toISOString() };
        var target = fn(data, stamp); if (target === false) throw new Error('Élément introuvable (supprimé entre-temps ?)');
        if (target && typeof target === 'object') target._mod = stamp;
        if (logInfo) { data.log = data.log || []; data.log.unshift(Object.assign({ id: uid('log'), at: stamp.at, by: stamp.by, byName: stamp.byName, kind: 'mod' }, logInfo)); if (data.log.length > 1500) data.log.length = 1500; }
        return post({ action: 'dbput', key: A.cfg.k, baseRev: g.rev, data: data, user: meName(), dev: '', app: 'mobile' }).then(function (p) {
          if (p.conflict) { if (n < 3) return attempt(n + 1); throw new Error('Quelqu\'un enregistre en même temps : réessayez'); }
          useData(data, p.rev); A.last = Date.now(); draw(); toast(okMsg || 'Enregistré ✔');
        });
      });
    };
    return attempt(0).catch(function (e) { toast(e.message, true); throw e; });
  }

  /* ---------- Comptes ---------- */
  function users() { return (Store.db && Store.db.users) || []; }
  function me() { return users().find(function (u) { return u.id === A.cfg.userId; }) || null; }
  function needLogin() { return users().length > 0 && !me(); }

  /* ---------- Outils ---------- */
  var toastT;
  function toast(m, bad) { var el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); document.body.appendChild(el); } el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = m; clearTimeout(toastT); toastT = setTimeout(function () { el.remove(); }, bad ? 5000 : 2200); }
  function phoneN(p) { return typeof normPhone === 'function' ? normPhone(p) : String(p || '').replace(/[^0-9]/g, ''); }
  function wa(phone, text) { var n = phoneN(phone); return 'https://wa.me/' + n + (text ? '?text=' + encodeURIComponent(text) : ''); }
  function pagesBase() { var u = (Store.db.settings && Store.db.settings.pagesUrl) || ''; if (u) return u.replace(/index\.html?$/, '').replace(/\/?$/, '/'); return location.href.replace(/[^/]*([?#].*)?$/, ''); }
  function rmLink(p) { return p.roadmap && p.roadmap.token && p.roadmap.publishedAt ? pagesBase() + '?f=' + p.roadmap.token : ''; }
  function replyLink(r) { return r.token && r.regHash ? pagesBase() + '?t=' + r.token : ''; }
  function stTag(p) { var c = { devis: 'info', confirme: 'ok', encours: 'warn', termine: '', annule: 'bad' }[p.status] || ''; return '<span class="tag ' + c + '">' + h(STATUSES[p.status] || p.status) + '</span>' + (p.sale ? ' <span class="tag warn">💼 Vente</span>' : ''); }
  function dRange(p) { return p.start ? (p.end && p.end !== p.start ? fmtDate(p.start) + ' → ' + fmtDate(p.end) : fmtDate(p.start)) : 'Dates à définir'; }
  function crewStats(p) { var c = { valide: 0, option: 0, attente: 0, indispo: 0 }; (p.crew || []).forEach(function (r) { c[r.status] = (c[r.status] || 0) + 1; }); return c; }
  function crewTags(p) { var c = crewStats(p); var o = ''; if (c.valide) o += '<span class="tag ok">✅ ' + c.valide + '</span> '; if (c.option) o += '<span class="tag info">🟦 ' + c.option + '</span> '; if (c.attente) o += '<span class="tag warn">⏳ ' + c.attente + '</span>'; return o; }
  function projRow(p) { return '<div class="it" data-go="project" data-id="' + p.id + '"><div class="bar" style="background:' + h(p.color || '#19a6cc') + '"></div><div class="grow"><div class="t">' + h(p.name) + '</div><div class="s">' + h(dRange(p)) + (p.venue ? ' · ' + h(p.venue) : '') + '</div><div style="margin-top:6px">' + stTag(p) + ' ' + crewTags(p) + '</div></div><div class="xs">›</div></div>'; }
  function live() { return Store.db.projects.filter(function (p) { return p.status !== 'annule'; }); }
  function ago(t) { var s = (Date.now() - t) / 1000; return s < 60 ? 'à l\'instant' : s < 3600 ? 'il y a ' + Math.round(s / 60) + ' min' : new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function initials(n) { return String(n || '?').split(/\s+/).map(function (x) { return x[0] || ''; }).join('').slice(0, 2).toUpperCase(); }

  /* ---------- Écrans ---------- */
  function draw() {
    if (!A.cfg.k) return drawSetup();
    if (!Store.db) return;
    if (needLogin()) return drawLogin();
    var top = A.stack[A.stack.length - 1];
    var body = top ? (top.v === 'project' ? vProject(top.id) : top.v === 'tech' ? vTech(top.id) : top.v === 'edit' ? vEdit(top.id) : '') : ({ home: vHome, plan: vPlan, proj: vProjects, team: vTeam, stock: vStock }[A.tab] || vHome)();
    var tabs = [['home', '🏠', 'Accueil'], ['plan', '📅', 'Planning'], ['proj', '✦', 'Projets'], ['team', '👷', 'Équipe'], ['stock', '▦', 'Stock']];
    var y = window.scrollY;
    $root().innerHTML = '<header id="hdr"></header><main>' + body + '</main><nav>' + tabs.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (!top && A.tab === t[0] ? 'on' : '') + '"><i>' + t[1] + '</i>' + t[2] + '</button>'; }).join('') + '</nav>';
    drawHeader(); if (A.keepScroll) window.scrollTo(0, y); A.keepScroll = false;
  }
  function drawHeader() {
    var el = document.getElementById('hdr'); if (!el) return; var top = A.stack[A.stack.length - 1];
    var title = top ? (top.v === 'project' || top.v === 'edit' ? ((getProject(top.id) || {}).name || 'Projet') : techName(getTech(top.id))) : (Store.db.settings.company || 'Impulsion Prod');
    var st = A.busy ? '<span class="spin">↻</span> Synchro…' : A.err ? '⚠ Hors ligne — ' + h(A.err) : A.last ? '☁ À jour ' + ago(A.last) : '';
    el.innerHTML = (top ? '<button class="hb" data-back>‹</button>' : '') + '<div class="ttl"><b>' + h(title) + '</b><span>' + st + '</span></div><button class="hb" data-refresh>↻</button>' + (top ? '' : '<button class="hb" data-menu>☰</button>');
  }

  function vHome() {
    var t0 = todayISO(), t14 = addDays(t0, 14), t60 = addDays(t0, 60); var P = live();
    var now = P.filter(function (p) { return p.start && p.start <= t0 && (p.end || p.start) >= t0; });
    var soon = P.filter(function (p) { return p.start && p.start > t0 && p.start <= t14; }).sort(function (a, b) { return a.start.localeCompare(b.start); });
    var todo = [];
    P.filter(function (p) { return (p.end || p.start || '') >= t0; }).forEach(function (p) {
      var c = crewStats(p); if (c.attente) todo.push({ p: p, ic: '⏳', t: c.attente + ' technicien(s) sans réponse' });
      if (p.start && p.start <= t60) { var sh = []; try { sh = projectShortages(p); } catch (e) { /* */ } if (sh.length) todo.push({ p: p, ic: '⚠️', t: 'Manque de matériel : ' + sh.map(function (x) { return x.missing + ' × ' + (x.prod.ref || x.prod.name); }).join(', ') }); }
      if (p.start && p.start <= addDays(t0, 7) && c.valide && !rmLink(p)) todo.push({ p: p, ic: '🗺️', t: 'Feuille de route pas encore publiée' });
      (p.crew || []).forEach(function (r) { var t = getTech(r.techId); var ind = r.status !== 'indispo' ? indispoOn(t, r.dates) : []; if (ind.length) todo.push({ p: p, ic: '🚫', t: techName(t) + ' s\'est déclaré indispo : ' + fmtDaysShort(ind) }); });
    });
    var u = me(); var log = (Store.db.log || []).slice(0, 8);
    var o = '<div style="font-size:21px;margin:6px 0 12px">Bonjour' + (u ? ' ' + h(u.name.split(' ')[0]) : '') + ' 👋</div>';
    o += '<div class="stat"><div><b>' + now.length + '</b><span>en cours</span></div><div><b>' + soon.length + '</b><span>sous 14 jours</span></div><div><b style="color:' + (todo.length ? 'var(--warn)' : 'var(--ok)') + '">' + todo.length + '</b><span>à traiter</span></div></div>';
    if (A.newer) o += '<div class="alert bad">Les données viennent d\'une version plus récente de l\'application : mettez à jour <b>app.html</b> sur GitHub (pack téléphone). Consultation seule en attendant.</div>';
    if (now.length) o += '<h2>En cours</h2>' + now.map(projRow).join('');
    o += '<h2>À venir (14 jours)</h2>' + (soon.length ? soon.map(projRow).join('') : '<div class="card xs">Rien de prévu.</div>');
    if (todo.length) o += '<h2>À traiter</h2>' + todo.map(function (x) { return '<div class="it" data-go="project" data-id="' + x.p.id + '"><div style="font-size:20px">' + x.ic + '</div><div class="grow"><div class="t">' + h(x.p.name) + '</div><div class="s">' + h(x.t) + '</div></div></div>'; }).join('');
    if (log.length) o += '<h2>Dernières modifications</h2><div class="card">' + log.map(function (e) { return '<div class="kv"><span>' + h(e.byName || '—') + ' · ' + h({ add: 'a créé', mod: 'a modifié', del: 'a supprimé', info: '' }[e.kind] || '') + ' ' + h(e.label || e.text || '') + '</span><span class="xs">' + new Date(e.at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + '</span></div>'; }).join('') + '</div>';
    return o;
  }
  function vPlan() {
    var t0 = todayISO(); var P = live().filter(function (p) { return p.start && (A.planPast ? true : (p.end || p.start) >= addDays(t0, -7)); }).sort(function (a, b) { return a.start.localeCompare(b.start); });
    if (A.planPast) P.reverse();
    var o = '<div class="chips"><button class="chip ' + (!A.planPast ? 'on' : '') + '" data-plan="0">À venir</button><button class="chip ' + (A.planPast ? 'on' : '') + '" data-plan="1">Tout (récents d\'abord)</button></div>'; var m = '';
    P.forEach(function (p) { var mm = new Date(p.start + 'T00:00:00').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); if (mm !== m) { m = mm; o += '<h2>' + h(mm) + '</h2>'; } o += projRow(p); });
    return o + (P.length ? '' : '<div class="empty">Aucun projet.</div>');
  }
  function vProjects() {
    var t0 = todayISO(); var q = A.q.toLowerCase(); var f = A.projFilter;
    var P = Store.db.projects.filter(function (p) {
      if (q && ![p.name, p.client, p.venue].join(' ').toLowerCase().includes(q)) return false;
      if (f === 'avenir') return p.status !== 'annule' && (p.end || p.start || '9') >= t0;
      if (f === 'passes') return (p.end || p.start || '') < t0;
      if (f === 'devis') return p.status === 'devis';
      return true;
    }).sort(function (a, b) { return f === 'avenir' ? (a.start || '').localeCompare(b.start || '') : (b.start || '').localeCompare(a.start || ''); });
    return '<input placeholder="🔎 Rechercher (nom, client, lieu)" value="' + h(A.q) + '" data-q style="margin-bottom:10px">'
      + '<div class="chips">' + [['avenir', 'À venir'], ['devis', 'Devis / options'], ['passes', 'Passés'], ['tous', 'Tous']].map(function (x) { return '<button class="chip ' + (f === x[0] ? 'on' : '') + '" data-pf="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>'
      + (P.length ? P.map(projRow).join('') : '<div class="empty">Aucun projet.</div>');
  }
  function vProject(id) {
    var p = getProject(id); if (!p) return '<div class="empty">Projet introuvable (supprimé ?)</div>';
    var link = rmLink(p); var rm = p.roadmap || {}; var o = '';
    o += '<div class="card"><div class="row"><div class="grow"><div style="font-size:20px;font-weight:700">' + h(p.name) + '</div>' + (p.client ? '<div class="s">' + h(p.client) + '</div>' : '') + '</div></div><div style="margin:8px 0">' + stTag(p) + '</div>'
      + '<div class="kv"><span>Dates</span><span>' + h(dRange(p)) + '</span></div>'
      + (p.venue ? '<div class="kv"><span>Lieu</span><span><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(rm.address || p.venue) + '">' + h(p.venue) + ' 🧭</a></span></div>' : '')
      + (p._mod ? '<div class="xs" style="margin-top:6px">🕘 Modifié par ' + h(p._mod.byName || '') + ' le ' + new Date(p._mod.at).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</div>' : '')
      + '<button class="btn" data-go="edit" data-id="' + p.id + '">✎ Modifier (statut, dates, lieu, notes)</button></div>';
    var sh = []; try { sh = projectShortages(p); } catch (e) { /* */ }
    if (sh.length) o += '<div class="alert bad">⚠️ <b>Manque de matériel</b><br>' + sh.map(function (x) { return h(x.prod.name) + ' : besoin ' + x.need + ', dispo ' + Math.max(0, x.free) + ' (manque ' + x.missing + ')'; }).join('<br>') + '</div>';
    if (p.notes) o += '<h2>Notes</h2><div class="card" style="white-space:pre-wrap;font-size:14px">' + h(p.notes) + '</div>';
    var crew = (p.crew || []).slice().sort(function (a, b) { return (ST_RANK[b.status] || 0) - (ST_RANK[a.status] || 0); });
    o += '<h2>Équipe (' + crew.length + ')</h2>' + (crew.length ? crew.map(function (r) {
      var t = getTech(r.techId); var s = CREW_ST[r.status] || {};
      return '<div class="it" data-crew="' + r.id + '"><div class="av" style="background:' + (s.c || '#888') + '">' + h(initials(techName(t))) + '</div><div class="grow"><div class="t">' + h(techName(t)) + '</div><div class="s">' + h([r.role, fmtDays(r.dates)].filter(Boolean).join(' · ')) + '</div>' + (typeof hoursShort === 'function' && hoursShort(r) ? '<div class="xs">🕘 ' + h(hoursShort(r)) + '</div>' : '') + (r.status !== 'indispo' && indispoOn(t, r.dates).length ? '<div class="xs" style="color:var(--bad)">' + h(indispoTxt(indispoOn(t, r.dates))) + '</div>' : '') + '</div><span class="tag ' + (s.cls || '') + '">' + (s.ic || '') + ' ' + h(s.l || r.status) + '</span></div>';
    }).join('') : '<div class="card xs">Aucun technicien sur ce projet.</div>');
    o += '<h2>Feuille de route</h2><div class="card">' + (link ? '<div class="btns"><a class="btn p" target="_blank" href="' + h(link) + '">🗺️ Ouvrir</a><a class="btn" href="#" data-copy="' + h(link) + '">📋 Copier le lien</a></div>' + (rm.groupLink ? '<a class="btn wa" target="_blank" href="' + h(rm.groupLink) + '">💬 Groupe WhatsApp du projet</a>' : '') : '<div class="xs">Pas encore publiée (à faire depuis le PC).</div>') + '</div>';
    if ((p.screens || []).length) o += '<h2>Écrans (' + p.screens.length + ')</h2>' + p.screens.map(function (s) {
      var g = {}; try { g = screenGeometry(s); } catch (e) { /* */ } var pr = getProduct(s.productId) || {};
      return '<div class="card"><b>' + h(s.name || 'Écran') + '</b><div class="s">' + h(pr.name || '—') + (pr.custom ? ' (hors catalogue)' : '') + '</div>'
        + '<div class="kv"><span>Dimensions</span><span>' + fmt((g.width || 0) / 1000, 2) + ' × ' + fmt((g.height || 0) / 1000, 2) + ' m</span></div>'
        + '<div class="kv"><span>Dalles</span><span>' + (g.panels || 0) + (isBoard(s) ? ' (boarding)' : ' (' + s.cols + ' × ' + s.rows + ')') + '</span></div>'
        + '<div class="kv"><span>Résolution</span><span>' + (g.resW || 0) + ' × ' + (g.resH || 0) + ' px</span></div>'
        + '<div class="kv"><span>Poids / conso max</span><span>' + fmt(g.weight || 0) + ' kg · ' + fmt((g.pMax || 0) / 1000, 1) + ' kW</span></div></div>';
    }).join('');
    var use = []; try { projectUsage(p).forEach(function (u, pid) { var pr = getProduct(pid); if (pr) use.push([pr, u.qty]); }); } catch (e) { /* */ }
    if (use.length) o += '<h2>Matériel</h2><div class="card">' + use.map(function (x) { return '<div class="kv"><span>' + h(x[0].name) + '</span><span><b>' + x[1] + '</b></span></div>'; }).join('') + '</div>';
    if ((p.fleet || []).length) o += '<h2>Transport</h2><div class="card">' + p.fleet.map(function (f) { var v = (Store.db.vehicles || []).find(function (x) { return x.id === f.vehicleId; }) || {}; var d = getTech(f.driverId); return '<div class="kv"><span>' + h(v.name || 'Véhicule') + (v.plate ? ' · ' + h(v.plate) : '') + '</span><span>' + (d ? h(techName(d)) : '—') + '</span></div>'; }).join('') + '</div>';
    var hist = (Store.db.log || []).filter(function (e) { return e.ref === p.id; }).slice(0, 6);
    if (hist.length) o += '<h2>Historique</h2><div class="card">' + hist.map(function (e) { return '<div class="kv"><span>' + h(e.byName || '—') + (e.parts && e.parts.length ? ' · ' + h(e.parts.join(', ')) : '') + '</span><span class="xs">' + new Date(e.at).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</span></div>'; }).join('') + '</div>';
    return o;
  }
  function vEdit(id) {
    var p = getProject(id); if (!p) return '<div class="empty">Projet introuvable</div>';
    return '<div class="card"><label class="f">Statut<select id="eStatus">' + Object.keys(STATUSES).map(function (k) { return '<option value="' + k + '" ' + (p.status === k ? 'selected' : '') + '>' + h(STATUSES[k]) + '</option>'; }).join('') + '</select></label>'
      + '<div class="btns"><label class="f">Début<input type="date" id="eStart" value="' + h(p.start || '') + '"></label><label class="f">Fin<input type="date" id="eEnd" value="' + h(p.end || '') + '"></label></div>'
      + '<label class="f">Lieu<input id="eVenue" value="' + h(p.venue || '') + '"></label>'
      + '<label class="f">Notes<textarea id="eNotes">' + h(p.notes || '') + '</textarea></label>'
      + '<div class="xs" style="margin-top:8px">Les dates des techniciens ne sont pas modifiées ici : ajustez-les depuis le PC si besoin.</div>'
      + '<button class="btn p" data-save="' + p.id + '">Enregistrer</button><button class="btn" data-back>Annuler</button></div>';
  }
  function vTeam() {
    var q = A.q.toLowerCase(); var t0 = todayISO();
    var T = (Store.db.techs || []).filter(function (t) { return t.active !== false && (!q || [t.firstName, t.lastName, t.phone].concat(t.skills || []).join(' ').toLowerCase().includes(q)); })
      .sort(function (a, b) { return (a.lastName || a.firstName || '').localeCompare(b.lastName || b.firstName || ''); });
    return '<input placeholder="🔎 Rechercher un technicien" value="' + h(A.q) + '" data-q style="margin-bottom:10px">' + T.map(function (t) {
      var up = upcoming(t, t0);
      var nInd = techIndispo(t).filter(function (d) { return d >= t0; }).length;
      return '<div class="it" data-go="tech" data-id="' + t.id + '"><div class="av" style="background:#19a6cc">' + h(initials(techName(t))) + '</div><div class="grow"><div class="t">' + h(techName(t)) + (nInd ? ' <span class="tag bad">🚫 ' + nInd + ' j.</span>' : '') + '</div><div class="s">' + (up.length ? up.slice(0, 2).map(function (x) { return (CREW_ST[x.r.status] || {}).ic + ' ' + h(x.p.name); }).join(' · ') + (up.length > 2 ? ' +' + (up.length - 2) : '') : 'Rien de prévu') + '</div></div>'
        + (phoneN(t.phone) ? '<a class="hb" href="tel:+' + phoneN(t.phone) + '" data-stop>📞</a>' : '') + '</div>';
    }).join('');
  }
  function upcoming(t, t0) { var o = []; live().forEach(function (p) { (p.crew || []).forEach(function (r) { if (r.techId === t.id && ((r.dates || []).slice().sort().pop() || p.end || '') >= t0) o.push({ p: p, r: r }); }); }); return o.sort(function (a, b) { return (a.p.start || '').localeCompare(b.p.start || ''); }); }
  function vTech(id) {
    var t = getTech(id); if (!t) return '<div class="empty">Technicien introuvable</div>'; var n = phoneN(t.phone); var up = upcoming(t, todayISO());
    var o = '<div class="card"><div style="font-size:20px;font-weight:700">' + h(techName(t)) + '</div><div class="s">' + h([t.phone, t.email].filter(Boolean).join(' · ')) + '</div>'
      + ((t.skills || []).length ? '<div style="margin-top:8px">' + t.skills.map(function (s) { return '<span class="tag">' + h(s) + '</span>'; }).join(' ') + '</div>' : '')
      + (t.licence ? '<div class="kv"><span>Permis</span><span>' + h(t.licence) + '</span></div>' : '')
      + (function () { var f = techIndispo(t).filter(function (d) { return d >= todayISO(); }); return f.length ? '<div class="alert bad" style="margin-top:10px">🚫 <b>Indisponible (déclaré)</b> : ' + h(f.map(dayLabel).join(', ')) + (t.indispo.note ? '<br>📝 ' + h(t.indispo.note) : '') + '</div>' : ''; })()
      + (n ? '<div class="btns" style="margin-top:12px"><a class="btn" href="tel:+' + n + '">📞 Appeler</a><a class="btn wa" target="_blank" href="' + wa(t.phone) + '">💬 WhatsApp</a></div>' : '')
      + (t.email ? '<a class="btn" href="mailto:' + h(t.email) + '">✉️ Email</a>' : '')
      + (t.espace && n ? '<a class="btn" target="_blank" href="' + h(wa(t.phone, 'Ton espace ' + (Store.db.settings.company || '') + ' (tous tes bookings) 👉 ' + pagesBase() + '?e=' + t.espace)) + '">📱 Renvoyer son espace mobile</a>' : '') + '</div>';
    o += '<h2>Ses prochains bookings</h2>' + (up.length ? up.map(function (x) { var s = CREW_ST[x.r.status] || {}; return '<div class="it" data-go="project" data-id="' + x.p.id + '"><div class="grow"><div class="t">' + h(x.p.name) + '</div><div class="s">' + h([x.r.role, fmtDays(x.r.dates)].filter(Boolean).join(' · ')) + '</div></div><span class="tag ' + (s.cls || '') + '">' + (s.ic || '') + ' ' + h(s.l || '') + '</span></div>'; }).join('') : '<div class="card xs">Rien de prévu.</div>');
    return o;
  }
  function vStock() {
    var q = A.q.toLowerCase(); var a = A.stockFrom, b = A.stockTo < A.stockFrom ? A.stockFrom : A.stockTo;
    var P = (Store.db.products || []).filter(function (x) { return !q || [x.ref, x.name, x.brand, x.category].join(' ').toLowerCase().includes(q); });
    return '<div class="btns"><label class="f" style="margin:0">Du<input type="date" data-sf="stockFrom" value="' + a + '"></label><label class="f" style="margin:0">Au<input type="date" data-sf="stockTo" value="' + b + '"></label></div>'
      + '<input placeholder="🔎 Rechercher une référence" value="' + h(A.q) + '" data-q style="margin:10px 0">'
      + '<div class="xs" style="margin-bottom:8px">Disponible = stock − pic d\'utilisation des projets confirmés sur la période.</div>'
      + P.map(function (x) { var pk = { peak: 0, projects: [] }; try { pk = peakUsage(x.id, a, b); } catch (e) { /* */ } var free = num(x.stock) - pk.peak; var col = free < 0 ? 'var(--bad)' : free < num(x.stock) * 0.15 ? 'var(--warn)' : 'var(--ok)';
        return '<div class="it" data-stockp="' + x.id + '"><div class="grow"><div class="t">' + h(x.name) + '</div><div class="s">' + h([x.ref, x.brand].filter(Boolean).join(' · ')) + ' · stock ' + fmt(num(x.stock)) + (pk.peak ? ' · utilisé ' + pk.peak : '') + '</div></div><div style="text-align:right"><b style="font-size:19px;color:' + col + '">' + fmt(free) + '</b><div class="xs">dispo</div></div></div>'
          + (A.openStock === x.id && pk.projects.length ? '<div class="card" style="margin-top:-4px">' + pk.projects.map(function (u) { return '<div class="kv"><span>' + h(u.p.name) + ' · ' + h(dRange(u.p)) + '</span><span><b>' + u.q + '</b></span></div>'; }).join('') + '</div>' : ''); }).join('');
  }

  /* ---------- Fiches (bas d'écran) ---------- */
  function sheet(html) { closeSheet(); var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = '<div class="sheet">' + html + '<button class="btn" data-close>Fermer</button></div>'; bg.addEventListener('click', function (e) { if (e.target === bg) closeSheet(); }); document.body.appendChild(bg); }
  function closeSheet() { var s = document.querySelector('.sheet-bg'); if (s) s.remove(); }
  function crewSheet(pid, rid) {
    var p = getProject(pid); var r = p && (p.crew || []).find(function (x) { return x.id === rid; }); if (!r) return;
    var t = getTech(r.techId) || {}; var n = phoneN(t.phone); var rl = replyLink(r); var fl = rmLink(p);
    var o = '<h3>' + h(techName(t)) + '</h3><div class="s">' + h([r.role, fmtDays(r.dates)].filter(Boolean).join(' · ')) + '</div>';
    if (r.dates && r.dates.length && typeof dayWithHours === 'function') o += '<div class="card" style="margin-top:10px">' + r.dates.slice().sort().map(function (d) { return '<div class="xs" style="color:var(--tx);margin:3px 0">📅 ' + h(dayWithHours(r, d)) + '</div>'; }).join('') + '</div>';
    o += '<div class="xs" style="margin-top:12px">Statut</div><div class="seg">' + Object.keys(CREW_ST).map(function (k) { var s = CREW_ST[k]; return '<button data-cst="' + k + '" data-p="' + p.id + '" data-r="' + r.id + '" style="' + (r.status === k ? 'background:' + s.c + ';color:#06131a;border-color:' + s.c : '') + '">' + s.ic + '<br>' + h(s.l) + '</button>'; }).join('') + '</div>';
    if (n) {
      o += '<div class="btns" style="margin-top:12px"><a class="btn" href="tel:+' + n + '">📞 Appeler</a><a class="btn wa" target="_blank" href="' + wa(t.phone) + '">💬 WhatsApp</a></div>';
      if (rl && r.status === 'attente') o += '<a class="btn" target="_blank" href="' + h(wa(t.phone, 'Salut ' + (t.firstName || '') + ' 👋 petit rappel pour ' + p.name + ' (' + fmtDays(r.dates) + ') : peux-tu me répondre ici ? 👉 ' + rl)) + '">⏰ Relancer (lien de réponse)</a>';
      if (fl && r.status === 'valide') o += '<a class="btn" target="_blank" href="' + h(wa(t.phone, 'Salut ' + (t.firstName || '') + ' 👋 voici la feuille de route de ' + p.name + ' 👉 ' + fl)) + '">🗺️ Envoyer la feuille de route</a>';
    } else o += '<div class="alert warn" style="margin-top:12px">Pas de numéro de téléphone valide.</div>';
    sheet(o);
  }
  function menuSheet() {
    var u = me();
    sheet('<h3>' + h(Store.db.settings.company || 'Impulsion Prod') + '</h3><div class="s">' + (u ? 'Connecté : ' + h(u.name) : 'Sans compte') + '</div>'
      + '<div class="card" style="margin-top:12px;font-size:13.5px;line-height:1.5">📱 <b>Installer sur l\'écran d\'accueil</b><br>iPhone (Safari) : Partager ⬆️ → « Sur l\'écran d\'accueil »<br>Android (Chrome) : menu ⋮ → « Installer l\'appli »</div>'
      + (users().length ? '<button class="btn" data-logout>Changer de compte</button>' : '')
      + '<button class="btn bad" data-forget>Déconnecter ce téléphone</button>');
  }

  /* ---------- Connexion ---------- */
  function drawSetup(err) {
    $root().innerHTML = '<div class="login"><div class="brand">Impulsion Prod</div><div class="brand-sub">APPLICATION TÉLÉPHONE</div>'
      + '<div class="card" style="font-size:14px;line-height:1.55">Sur votre PC : <b>Comptes & partage → 📱 Installer sur mon téléphone</b>, puis ouvrez le lien reçu sur ce téléphone.<br><br>Ou collez ici le <b>code de connexion</b> (il commence par ILM1-) :</div>'
      + '<textarea id="code" placeholder="ILM1-…" style="min-height:90px;font-family:monospace;font-size:13px"></textarea>' + (err ? '<div class="alert bad" style="margin-top:10px">' + h(err) + '</div>' : '')
      + '<button class="btn p" data-connect>Se connecter</button><div class="xs" style="margin-top:14px">Ce code donne accès à toutes les données de l\'entreprise : ne le partagez qu\'avec la direction.</div></div>';
  }
  function parseCode(code) { var m = String(code || '').trim().match(/ILM1-([A-Za-z0-9+/=]+)/); if (!m) return null; try { var o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); return /^https:\/\/script\.google(usercontent)?\.com\//.test(o.u) && o.k ? o : null; } catch (e) { return null; } }
  function connect(code) {
    var o = parseCode(code); if (!o) return drawSetup('Code invalide : il commence par ILM1-');
    A.cfg = { u: o.u, k: o.k, c: o.c }; $root().innerHTML = '<div class="empty" style="padding-top:120px"><span class="spin">↻</span> Connexion…</div>';
    fetchDb(-1).then(function (j) { if (!j.data) throw new Error('Aucune donnée partagée : activez d\'abord le partage sur le PC (Comptes & partage).'); LS.set('ip-app', A.cfg); useData(j.data, j.rev); A.last = Date.now(); draw(); })
      .catch(function (e) { A.cfg = {}; drawSetup(e.message); });
  }
  function drawLogin(pick, err) {
    var U = users();
    if (!pick) { $root().innerHTML = '<div class="login"><div class="brand">' + h(Store.db.settings.company || 'Impulsion') + '</div><div class="brand-sub">QUI ÊTES-VOUS ?</div>' + U.map(function (u) { return '<button class="user" data-user="' + u.id + '"><span class="av" style="background:' + h(u.color || '#19a6cc') + '">' + h(initials(u.name)) + '</span><span class="grow"><b>' + h(u.name) + '</b><div class="xs">' + h(u.title || '') + '</div></span>›</button>'; }).join('') + '</div>'; return; }
    var u = U.find(function (x) { return x.id === pick; }); if (!u) return drawLogin();
    if (!u.pwd) { A.cfg.userId = u.id; LS.set('ip-app', A.cfg); return draw(); }
    $root().innerHTML = '<div class="login"><div class="brand">' + h(u.name) + '</div><div class="brand-sub">MOT DE PASSE</div><input type="password" id="pwd" autocomplete="current-password" placeholder="Mot de passe">' + (err ? '<div class="alert bad" style="margin-top:10px">' + h(err) + '</div>' : '') + '<button class="btn p" data-pwd="' + u.id + '">Entrer</button><button class="btn" data-logout>‹ Retour</button></div>';
    setTimeout(function () { var i = document.getElementById('pwd'); if (i) i.focus(); }, 50);
  }

  /* ---------- Événements ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-tab],[data-go],[data-back],[data-refresh],[data-menu],[data-crew],[data-cst],[data-close],[data-connect],[data-user],[data-pwd],[data-logout],[data-forget],[data-save],[data-copy],[data-pf],[data-plan],[data-stockp],[data-stop]');
    if (!el) return; var d = el.dataset;
    if ('stop' in d) return;
    if (d.tab) { A.tab = d.tab; A.stack = []; A.q = ''; window.scrollTo(0, 0); return draw(); }
    if (d.go) { e.preventDefault(); closeSheet(); A.stack.push({ v: d.go, id: d.id }); window.scrollTo(0, 0); return draw(); }
    if ('back' in d) { A.stack.pop(); return draw(); }
    if ('refresh' in d) return refresh(true);
    if ('menu' in d) return menuSheet();
    if ('close' in d) return closeSheet();
    if (d.crew) { var top = A.stack[A.stack.length - 1]; return crewSheet(top.id, d.crew); }
    if (d.cst) {
      var pid = d.p, rid = d.r, v = d.cst; var cur = getProject(pid); var rr = cur && cur.crew.find(function (x) { return x.id === rid; }); if (!rr || rr.status === v) return;
      closeSheet(); A.keepScroll = true;
      return mutate(function (data) { var p = (data.projects || []).find(function (x) { return x.id === pid; }); var r = p && (p.crew || []).find(function (x) { return x.id === rid; }); if (!r) return false; r.status = v; (r.history = r.history || []).push({ at: new Date().toISOString(), action: 'statut', status: v, by: 'mobile' }); return p; },
        { type: 'project', ref: pid, label: cur.name, parts: ['équipe'] }, techName(getTech(rr.techId)) + ' : ' + CREW_ST[v].l + ' ✔').catch(function () {});
    }
    if (d.save) {
      var id = d.save; var vals = { status: document.getElementById('eStatus').value, start: document.getElementById('eStart').value, end: document.getElementById('eEnd').value, venue: document.getElementById('eVenue').value.trim(), notes: document.getElementById('eNotes').value };
      if (vals.end && vals.start && vals.end < vals.start) return toast('La fin est avant le début', true);
      var before = getProject(id); var parts = []; ['status', 'start', 'end', 'venue', 'notes'].forEach(function (k) { if ((before[k] || '') !== (vals[k] || '')) parts.push({ status: 'statut', start: 'dates', end: 'dates', venue: 'lieu', notes: 'notes' }[k]); });
      if (!parts.length) { A.stack.pop(); return draw(); }
      return mutate(function (data) { var p = (data.projects || []).find(function (x) { return x.id === id; }); if (!p) return false; Object.keys(vals).forEach(function (k) { if ((p[k] || '') !== (vals[k] || '')) p[k] = vals[k]; }); return p; },
        { type: 'project', ref: id, label: before.name, parts: parts.filter(function (x, i, a) { return a.indexOf(x) === i; }) }).then(function () { A.stack.pop(); draw(); }).catch(function () {});
    }
    if (d.copy) { e.preventDefault(); try { navigator.clipboard.writeText(d.copy).then(function () { toast('Lien copié ✔'); }); } catch (x) { toast(d.copy); } return; }
    if (d.pf) { A.projFilter = d.pf; return draw(); }
    if (d.plan) { A.planPast = d.plan === '1'; return draw(); }
    if (d.stockp) { A.openStock = A.openStock === d.stockp ? null : d.stockp; A.keepScroll = true; return draw(); }
    if ('connect' in d) return connect(document.getElementById('code').value);
    if (d.user) return drawLogin(d.user);
    if (d.pwd) { var u = users().find(function (x) { return x.id === d.pwd; }); var pw = document.getElementById('pwd').value; if (u && pwdOk(u, pw)) { A.cfg.userId = u.id; LS.set('ip-app', A.cfg); closeSheet(); return draw(); } return drawLogin(d.pwd, 'Mot de passe incorrect'); }
    if ('logout' in d) { closeSheet(); A.cfg.userId = null; LS.set('ip-app', A.cfg); return drawLogin(); }
    if ('forget' in d) { if (!confirm('Déconnecter ce téléphone ? Il faudra le code de connexion pour revenir.')) return; LS.del('ip-app'); LS.del('ip-app-cache'); A.cfg = {}; Store.db = null; A.raw = null; closeSheet(); return drawSetup(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.matches('[data-q]')) { A.q = e.target.value; var pos = e.target.selectionStart; draw(); var i = document.querySelector('[data-q]'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) { /* */ } } }
  });
  document.addEventListener('change', function (e) { if (e.target.dataset.sf) { A[e.target.dataset.sf] = e.target.value; draw(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'pwd') { var b = document.querySelector('[data-pwd]'); if (b) b.click(); } });

  /* ---------- Démarrage ---------- */
  var hm = location.hash.match(/c=(ILM1-[A-Za-z0-9+/=%]+)/);
  if (hm) { try { history.replaceState(null, '', location.pathname + location.search); } catch (x) { /* */ } connect(decodeURIComponent(hm[1])); }
  else if (!A.cfg.k) drawSetup();
  else {
    var c = LS.get('ip-app-cache'); if (c && c.data) { useData(c.data, c.rev); A.last = c.at; draw(); }
    else $root().innerHTML = '<div class="empty" style="padding-top:120px"><span class="spin">↻</span> Chargement…</div>';
    refresh(false).then(function () { if (!Store.db) drawSetup(A.err || 'Connexion impossible'); });
  }
  setInterval(function () { if (A.cfg.k && Store.db && document.visibilityState === 'visible' && !document.querySelector('.sheet-bg') && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) && !(A.stack.length && A.stack[A.stack.length - 1].v === 'edit')) refresh(false); }, 30000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && A.cfg.k && Store.db && Date.now() - A.last > 10000) refresh(false); });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (x) { /* */ } }
  window.__IPAPP = A;
})();
</script>
</body></html>
